version: '3.8'

services:
  gmailo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmailo-platform
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_PRIMARY_MODEL=${NVIDIA_PRIMARY_MODEL:-openai/gpt-oss-20b}
      - NVIDIA_FALLBACK_MODEL=${NVIDIA_FALLBACK_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - NVIDIA_MAX_OUTPUT_TOKENS=${NVIDIA_MAX_OUTPUT_TOKENS:-2048}
      - NVIDIA_TEMPERATURE=${NVIDIA_TEMPERATURE:-0.1}
      - APP_SECRET=${APP_SECRET}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - DATABASE_URL=${DATABASE_URL:-file:./dev.db}
    env_file:
      - .env
