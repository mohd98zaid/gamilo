services:
  gmailo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmailo-platform
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_PRIMARY_MODEL=${NVIDIA_PRIMARY_MODEL:?NVIDIA_PRIMARY_MODEL is required}
      - NVIDIA_FALLBACK_MODEL=${NVIDIA_FALLBACK_MODEL}
      - NVIDIA_MAX_OUTPUT_TOKENS=${NVIDIA_MAX_OUTPUT_TOKENS:-2048}
      - NVIDIA_TEMPERATURE=${NVIDIA_TEMPERATURE:-0.1}
      - APP_SECRET=${APP_SECRET}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set to PostgreSQL for production}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
